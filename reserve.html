<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de bicicleta</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <h1>Rueda Libre</h1>

        <form action="">
            <fieldset>
                <legend>Reserva tu bicicleta</legend>

                <p>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </p>

                <p>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </p>

                <p>
                    <label for="fecha">Día de la reserva:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </p>

                <p>
                    <label for="bicicleta">¿Qué bicicleta prefieres?</label>
                    <select id="bicicleta" name="bicicleta" required>
                        <option value="">Elige una bicicleta</option>
                        <option value="montaña">Bicicleta de montaña</option>
                        <option value="carretera">Bicicleta de carretera</option>
                        <option value="electrica">Bicicleta eléctrica</option>
                    </select>
                </p>
            </fieldset>

            <p>
                <button type="submit">Enviar reserva</button>
            </p>
        </form>

        <p><a href="index.html">Regresar a la página principal</a></p>
    </main>

</body>

</html>
