<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reserva de bicicleta</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <nav class="navbar">
            <a href="index.html" aria-label="Rueda Libre, inicio">
                <img
                    src="img/Rueda_libre.png"
                    alt="Logo Rueda Libre"
                    width="80"
                    height="60"
                />
            </a>
            <div class="menu">
                <a href="index.html" class="btn btn-outline-success">Inicio</a>
                <a href="tarifas.html" class="btn btn-outline-success"
                    >Tarifas</a
                >
                <a
                    href="reserve.html"
                    class="btn btn-success"
                    aria-current="page"
                    >Reservar</a
                >
            </div>
        </nav>

        <main class="container py-5">
            <h1>Rueda Libre</h1>

            <form action="" class="card border-0 shadow-sm">
                <fieldset class="border-0 p-0">
                    <legend>Reserva tu bicicleta</legend>

                    <p class="mb-3">
                        <label for="nombre" class="form-label"
                            >Nombre completo:</label
                        >
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-control"
                            required
                        />
                    </p>

                    <p class="mb-3">
                        <label for="correo" class="form-label"
                            >Correo electrónico:</label
                        >
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            class="form-control"
                            required
                        />
                    </p>

                    <p class="mb-3">
                        <label for="fecha" class="form-label"
                            >Día de la reserva:</label
                        >
                        <input
                            type="date"
                            id="fecha"
                            name="fecha"
                            class="form-control"
                            required
                        />
                    </p>

                    <p class="mb-3">
                        <label for="bicicleta" class="form-label"
                            >¿Qué bicicleta prefieres?</label
                        >
                        <select
                            id="bicicleta"
                            name="bicicleta"
                            class="form-select"
                            required
                        >
                            <option value="">Elige una bicicleta</option>
                            <option value="montaña">
                                Bicicleta de montaña
                            </option>
                            <option value="carretera">
                                Bicicleta de carretera
                            </option>
                            <option value="electrica">
                                Bicicleta eléctrica
                            </option>
                        </select>
                    </p>
                </fieldset>

                <p class="mb-0 mt-3">
                    <button type="submit" class="btn btn-success">
                        Enviar reserva
                    </button>
                </p>
            </form>

            <p class="mt-4 text-center">
                <a class="link-success" href="index.html"
                    >Regresar a la página principal</a
                >
            </p>
        </main>
    </body>
</html>
